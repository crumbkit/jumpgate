[package]
name = "jumpgate"
description = "Need, offer, binding and target records that match what each app needs to what a provider offers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
include = ["src/**/*.rs", "schemas/**/*.json"]

[dependencies]
# `derive` writes the JSON form of each record type.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `derive` writes the JSON Schema of each record type from its Rust type.
schemars = { workspace = true, features = ["derive"] }
# `parse` and `serde` read `mxv.toml`; `Spanned` gives a refusal its line.
toml = { workspace = true, features = ["std", "parse", "serde"] }
starmap = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
