[workspace]
resolver = "3"
members = ["crates/jumpgate", "crates/jumpgate-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# serde derives the JSON form of each record that the library writes. The
# workspace entry enables only `std`, and each crate enables `derive`.
serde = { version = "1.0.229", default-features = false, features = ["std"] }

# serde_json reads a record's text into a JSON value, which the library's
# record parser walks field by field, and writes a record's text.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

# schemars writes the JSON Schema (draft 2020-12) of each record type from
# the Rust types, so the committed schemas cannot drift from the parser's
# types. crumbkit depends on it too, so it adds no crate to the CLI.
schemars = { version = "1.2.3", default-features = false, features = ["std"] }

# toml reads `mxv.toml` into typed structs with the spans that give a
# refusal its line. It is the parser that mxv itself uses.
toml = { version = "1.2.1", default-features = false }

# starmap parses `starmap.toml`. jumpgate calls `starmap::Spec::parse` and
# never the resolver, so it reads no secret store.
starmap = "0.4.0"

# clap parses the `jumpgate` command line. The workspace entry enables only
# `std`, and jumpgate-cli enables the user-facing features it uses.
clap = { version = "4.6.7", default-features = false, features = ["std"] }

# crumbkit holds the command-line conventions of the `jumpgate` command
# (the cli profile of the Rust standards): `parse` and `finish`, failures
# with stable codes and a next step, and the help guide. The workspace entry
# enables no feature, and jumpgate-cli enables the ones it uses.
crumbkit = { version = "0.4.1", default-features = false }

# crumbkit-skills gives the `jumpgate` command `skills install`, `skills
# check` and `skills print`, which install the agent skill that the binary
# embeds into the agent skills directories (CLI-15).
crumbkit-skills = "0.4.1"

# crumbkit-test checks the `jumpgate` command against crumbkit's
# conventions (CLI-6). Only tests use it.
crumbkit-test = "0.4.1"

# jsonschema validates the refusal fixtures against the committed JSON
# Schemas, so a value the parser refuses and the schema accepts fails a
# test. Only tests use it. Without default features it fetches no remote
# schema and brings in no TLS stack.
jsonschema = { version = "0.61.2", default-features = false }

# tempfile gives each command test a directory of its own, removed when the
# test ends. Only tests use it.
tempfile = "3.27.0"

# The lint table is lints/base.toml and lints/library.toml of the Rust
# standards (BASE-1, LIB-2, LIB-3). A build with CARGO_BUILD_WARNINGS=deny
# fails on any warning, and every package inherits the table through
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"                 # BASE-3
unreachable_pub = "warn"               # BASE-8
missing_debug_implementations = "warn"
missing_docs = "deny"                  # LIB-2

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny" # LIB-2

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"                # BASE-2
allow_attributes_without_reason = "deny" # BASE-2
unwrap_used = "deny"                     # BASE-4
expect_used = "deny"                     # BASE-4
panic = "deny"                           # BASE-4
todo = "deny"                            # BASE-4
unimplemented = "deny"                   # BASE-4
dbg_macro = "deny"                       # BASE-4
unreachable = "deny"                     # BASE-4
indexing_slicing = "deny"                # BASE-4
cast_possible_truncation = "deny"        # BASE-12
cast_sign_loss = "deny"                  # BASE-12
cast_possible_wrap = "deny"              # BASE-12
cast_precision_loss = "deny"             # BASE-12
cast_lossless = "deny"                   # BASE-12
disallowed_methods = "deny"              # BASE-5, BASE-6, BASE-7, BASE-11
disallowed_types = "deny"                # BASE-5
disallowed_macros = "deny"               # BASE-5, BASE-7
print_stdout = "deny"                    # BASE-5
print_stderr = "deny"                    # BASE-5
mod_module_files = "deny"                # BASE-9
too_many_lines = "deny"                  # BASE-10
wildcard_imports = "deny"                # BASE-13
enum_glob_use = "deny"                   # BASE-13
ref_option = "deny"                      # BASE-14
needless_for_each = "deny"               # BASE-15
fn_params_excessive_bools = "deny"       # BASE-16
wildcard_enum_match_arm = "deny"         # BASE-56
match_wildcard_for_single_variants = "deny" # BASE-56
missing_errors_doc = "deny"              # LIB-2
missing_panics_doc = "deny"              # LIB-2
must_use_candidate = "deny"              # LIB-3

# Arithmetic overflow panics in release builds too (BASE-27). The map's
# release-profile decision records why the other settings keep Cargo's
# defaults.
[profile.release]
overflow-checks = true
