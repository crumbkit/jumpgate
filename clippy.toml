# The union of the clippy.toml fragments of the base and child-process
# profiles of the Rust standards (the cli profile has no fragment). Each
# effect belongs to one owning module, which suppresses the lint with
# #[expect] and a reason (BASE-5). crates/jumpgate/src/store/directory.rs
# owns the library's file access, crates/jumpgate-cli/src/checkout.rs owns
# the command's reads of a checkout, and crates/jumpgate-cli/src/git.rs owns
# the git process and the clock for its deadline (PROC-1). The standard
# streams and the environment belong to crumbkit, so no other module of
# jumpgate-cli suppresses them. The change that adds the board store names
# its process module in the PROC-1 reasons below.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 150 # BASE-10
max-fn-params-bools = 3 # BASE-16

disallowed-methods = [
    # BASE-6
    { path = "std::env::var", reason = "read the environment snapshot" },
    { path = "std::env::var_os", reason = "read the environment snapshot" },
    { path = "std::env::vars", reason = "only the entry point captures the environment" },
    { path = "std::env::vars_os", reason = "only the entry point captures the environment" },
    { path = "std::env::set_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::remove_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::current_dir", reason = "read the directory from the snapshot" },
    { path = "std::env::set_current_dir", reason = "pass the directory to the operation instead" },
    # BASE-5: the clock
    { path = "std::time::Instant::now", reason = "read the time from the clock owner" },
    { path = "std::time::SystemTime::now", reason = "read the time from the clock owner" },
    { path = "tokio::time::Instant::now", reason = "read the time from the clock owner", allow-invalid = true },
    # BASE-5: the file system
    { path = "std::fs::read", reason = "read files through the file system owner" },
    { path = "std::fs::read_to_string", reason = "read files through the file system owner" },
    { path = "std::fs::read_dir", reason = "read directories through the file system owner" },
    { path = "std::fs::write", reason = "write files through the file system owner" },
    { path = "std::fs::File::open", reason = "open files through the file system owner" },
    { path = "std::fs::File::create", reason = "create files through the file system owner" },
    { path = "std::fs::File::options", reason = "open files through the file system owner" },
    { path = "std::fs::OpenOptions::new", reason = "open files through the file system owner" },
    { path = "tokio::fs::read", reason = "read files through the file system owner", allow-invalid = true },
    { path = "tokio::fs::read_to_string", reason = "read files through the file system owner", allow-invalid = true },
    { path = "tokio::fs::read_dir", reason = "read directories through the file system owner", allow-invalid = true },
    { path = "tokio::fs::write", reason = "write files through the file system owner", allow-invalid = true },
    { path = "tokio::fs::File::open", reason = "open files through the file system owner", allow-invalid = true },
    { path = "tokio::fs::File::create", reason = "create files through the file system owner", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::new", reason = "open files through the file system owner", allow-invalid = true },
    # BASE-5: the network
    { path = "std::net::TcpStream::connect", reason = "connect through the network owner" },
    { path = "std::net::TcpStream::connect_timeout", reason = "connect through the network owner" },
    { path = "tokio::net::TcpStream::connect", reason = "connect through the network owner", allow-invalid = true },
    # BASE-5: the standard streams (CLI-1)
    { path = "std::io::stdin", reason = "read through crumbkit's Output, the standard-stream owner" },
    { path = "std::io::stdout", reason = "write through crumbkit's Output, the standard-stream owner" },
    { path = "std::io::stderr", reason = "write through crumbkit's Output, the standard-stream owner" },
    # BASE-7
    { path = "std::process::exit", reason = "return the exit code from main so destructors run" },
    # BASE-11
    { path = "std::thread::sleep", reason = "wait for an observable signal, or sleep in the clock owner" },
    { path = "tokio::time::sleep", reason = "wait for an observable signal, or sleep in the clock owner", allow-invalid = true },
    # PROC-1
    { path = "std::process::Command::new", reason = "start processes through the process module" },
    { path = "std::process::Command::spawn", reason = "start processes through the process module" },
    { path = "std::process::Command::status", reason = "start processes through the process module" },
    { path = "std::process::Command::output", reason = "start processes through the process module" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "replacing this process bypasses the process module" },
    { path = "tokio::process::Command::new", reason = "start processes through the process module", allow-invalid = true },
    { path = "tokio::process::Command::spawn", reason = "start processes through the process module", allow-invalid = true },
    { path = "tokio::process::Command::status", reason = "start processes through the process module", allow-invalid = true },
    { path = "tokio::process::Command::output", reason = "start processes through the process module", allow-invalid = true },
]

disallowed-types = [
    # PROC-1
    { path = "std::process::Child", reason = "let the process module hold the child, which owns its deadline and cleanup" },
]

# BASE-5: the standard-stream macros. BASE-7: jumpgate has no untyped-error
# crate, so no error macro is listed.
disallowed-macros = [
    { path = "std::println", reason = "write through crumbkit's Output, the standard-stream owner" },
    { path = "std::eprintln", reason = "write through crumbkit's Output, the standard-stream owner" },
    { path = "std::print", reason = "write through crumbkit's Output, the standard-stream owner" },
    { path = "std::eprint", reason = "write through crumbkit's Output, the standard-stream owner" },
]
